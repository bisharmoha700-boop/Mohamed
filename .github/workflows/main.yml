name: Winlator Tailscale RDP
on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Connect Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          
      - name: Enable RDP and Show Info
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-LocalUser -Name "runneradmin" -Password (ConvertTo-SecureString -AsPlainText "WinlatorRDP2024!" -Force)
          $ip = (Get-NetIPAddress -AddressFamily IPv4 | Where-Object {$_.InterfaceAlias -like "*Tailscale*"}).IPAddress
          Write-Host "=========================================="
          Write-Host " TAILSCALE IP: $ip"
          Write-Host " USERNAME: runneradmin"
          Write-Host " PASSWORD: WinlatorRDP2024!"
          Write-Host "=========================================="
          $end = (Get-Date).AddMinutes(350)
          while((Get-Date) -lt $end){ Write-Host "RDP Running $ip - $(Get-Date)"; Start-Sleep -Seconds 200 }
